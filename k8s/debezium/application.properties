# Debezium Server configuration: Oracle (LogMiner) in, Azure Event Hubs out.
# Mounted into the pod as /debezium/config/application.properties.
#
# ${...} values come from environment variables, which the StatefulSet fills
# from the "debezium-credentials" Secret (created by scripts/deploy-debezium.sh).
# No password or key is stored in this file.

# ---------------------------------------------------------------------------
# Sink: Azure Event Hubs (AMQP over TLS, port 5671, outbound only)
# ---------------------------------------------------------------------------
debezium.sink.type=eventhubs
debezium.sink.eventhubs.connectionstring=${EH_CONNECTION_STRING}
debezium.sink.eventhubs.hubname=oracle-changes
# Use the record key (= the row's primary key) as partition key, so all
# changes to one row land in the same partition and stay in order.
debezium.sink.eventhubs.dynamicpartitionrouting=key

# ---------------------------------------------------------------------------
# Source: Oracle via LogMiner
# ---------------------------------------------------------------------------
debezium.source.connector.class=io.debezium.connector.oracle.OracleConnector
debezium.source.database.connection.adapter=logminer
# Read the dictionary from the live catalog: nothing extra is written to redo.
debezium.source.log.mining.strategy=online_catalog

# Connect to the CDB (LogMiner runs there), capture from the PDB.
# The hostname is the Oracle Service in the "oracle" namespace.
debezium.source.database.hostname=oracle.oracle.svc.cluster.local
debezium.source.database.port=1521
debezium.source.database.user=c##dbzuser
debezium.source.database.password=${DBZ_PASSWORD}
debezium.source.database.dbname=FREE
debezium.source.database.pdb.name=FREEPDB1

# Logical name of this source. Appears in every event's "source" block.
debezium.source.topic.prefix=oracle

# Captured tables. Currently only the 10-row SALES.PRODUCTS, which keeps the
# snapshot tiny while the pipeline is developed and tested.
#
# To capture the business tables (one instance for both schemas), use instead:
#   debezium.source.schema.include.list=SALES,BILLING
#   debezium.source.table.include.list=SALES.CUSTOMERS,SALES.ORDERS,SALES.ORDER_ITEMS,BILLING.INVOICES
# and clear Debezium's state volume (offsets + schema history) so the new tables
# get an initial snapshot.
# For one instance per schema, deploy this twice with different include lists.
debezium.source.schema.include.list=SALES
debezium.source.table.include.list=SALES.PRODUCTS

# First start: snapshot the existing rows (op = r), then stream changes.
debezium.source.snapshot.mode=initial

# Oracle NUMBER would otherwise arrive as binary-encoded decimals.
debezium.source.decimal.handling.mode=string
# Tombstones are only useful for compacted topics; Bronze doesn't need them.
debezium.source.tombstones.on.delete=false
# Emits a small heartbeat event every minute, so the stored SCN keeps moving
# even when the captured tables are quiet (and old archive logs can be purged).
# Heartbeats land in the same event hub; Bronze filters them out (they have no "op").
debezium.source.heartbeat.interval.ms=60000

# ---------------------------------------------------------------------------
# State: offsets (last processed SCN) and schema history, on the pod's PVC.
# Without these, every restart would mean a full re-snapshot.
# ---------------------------------------------------------------------------
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=data/schema-history.dat
# Record DDL only for the captured tables, not for every table in the database.
debezium.source.schema.history.internal.store.only.captured.tables.ddl=true

# ---------------------------------------------------------------------------
# Event format: plain JSON payload, without the embedded schema block.
# Keeps events small; the Bronze layer stores them as they arrive.
# ---------------------------------------------------------------------------
debezium.format.key=json
debezium.format.key.schemas.enable=false
debezium.format.value=json
debezium.format.value.schemas.enable=false

quarkus.log.level=INFO
